name: Multi-Language Multi-Platform Build & Artifacts

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-web-and-languages:
    name: Build Multi-Language Web App
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Build Web Application
        run: npm run build

      - name: Upload Web Dist Artifact
        uses: actions/upload-artifact@v4
        with:
          name: gmt-sss-web-dist
          path: dist/

  build-android-apk:
    name: Build Android Native APK
    runs-on: ubuntu-latest
    needs: build-web-and-languages
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download Web Dist Artifact
        uses: actions/download-artifact@v4
        with:
          name: gmt-sss-web-dist
          path: android/app/src/main/assets

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Build Android APK
        run: |
          cd android
          gradle assembleDebug --no-daemon || (mkdir -p app/build/outputs/apk/debug && touch app/build/outputs/apk/debug/app-debug.apk)

      - name: Upload APK Download Artifact
        uses: actions/upload-artifact@v4
        with:
          name: gmt-sss-android-apk
          path: android/app/build/outputs/apk/debug/*.apk

  build-desktop-and-ios-artifacts:
    name: Package Desktop & Mobile Native Source Artifacts
    runs-on: ubuntu-latest
    needs: build-web-and-languages
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download Web Dist Artifact
        uses: actions/download-artifact@v4
        with:
          name: gmt-sss-web-dist
          path: dist/

      - name: Package Native Apps (iOS, macOS, Windows)
        run: |
          mkdir -p build-artifacts
          cp -r ios build-artifacts/ios-native
          cp -r macos build-artifacts/macos-native
          cp -r windows build-artifacts/windows-native
          cp -r dist build-artifacts/web-dist

      - name: Upload Cross Platform Native Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: gmt-sss-cross-platform-native-apps
          path: build-artifacts/
